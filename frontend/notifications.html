<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1890ff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="庆师易校圈" />
    <link rel="apple-touch-icon" href="./assets/icons/logo-192.png" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <meta name="description" content="庆师易校圈 · 消息中心" />
    <title>消息 · 庆师易校圈</title>

    <!-- 路由守卫：必须在业务脚本之前 -->
    <script src="./js/auth.js"></script>

    <link rel="stylesheet" href="./css/variables.css" />
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/layout.css" />
    <link rel="stylesheet" href="./components/base.css" />
    <link rel="stylesheet" href="./components/motion.css" />
    <link rel="stylesheet" href="./components/shell.css" />
    <link rel="stylesheet" href="./fonts/fonts.css" />
    <link rel="stylesheet" href="./components/feedback.css" />
  </head>

  <body class="page-with-tabbar" style="background-color: var(--bg-color)">
    <div id="network-banner" class="network-banner" role="status" aria-live="polite"></div>

    <header class="navbar">
      <span class="navbar__title navbar__title--center">消息</span>
      <button class="navbar__back" id="read-all-btn" type="button">全部已读</button>
    </header>

    <main class="page page--narrow page--notifications" style="padding-bottom: 24px">
      <section class="card" style="margin-top: 12px" aria-labelledby="notice-title">
        <div class="log-card__head">
          <h2 class="log-card__title" id="notice-title">通知</h2>
          <span class="log-card__count" id="notice-count">共 0 条</span>
        </div>

        <ul class="notice-list" id="notice-list" aria-live="polite"></ul>
        <div class="hidden" id="notice-empty"></div>
      </section>
    </main>
    <!-- 全局发布按钮（FAB） -->
    <a class="fab" id="fab-publish" href="./publish.html" aria-label="发布闲置">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.4"
        stroke-linecap="round"
        aria-hidden="true"
      >
        <path d="M12 5v14M5 12h14" />
      </svg>
    </a>

    <nav class="tabbar" aria-label="主导航">
      <a class="tabbar__item" href="./index.html">
        <span class="tabbar__icon" aria-hidden="true">🏠</span>
        <span>首页</span>
      </a>
      <a class="tabbar__item" href="./orders.html">
        <span class="tabbar__icon" aria-hidden="true">📋</span>
        <span>订单</span>
      </a>
      <a class="tabbar__item is-active" href="./notifications.html" aria-current="page">
        <span class="tabbar__icon" aria-hidden="true">🔔</span>
        <span>消息<b class="tabbar__badge hidden" data-unread></b></span>
      </a>
      <a class="tabbar__item" href="./profile.html">
        <span class="tabbar__icon" aria-hidden="true">👤</span>
        <span>我的</span>
      </a>
    </nav>

    <script type="module" src="./js/notifications.js"></script>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
