<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1890ff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="易校圈" />
    <link rel="apple-touch-icon" href="./assets/icons/logo-192.png" />
    <link rel="manifest" href="./manifest.json" />
    <meta name="description" content="易校圈 · 物品详情" />
    <title>物品详情 · 易校圈</title>

    <!-- 公共样式：令牌 → 重置 → 布局工具类 → 基础组件 → 反馈组件 -->
    <link rel="stylesheet" href="./css/variables.css" />
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/layout.css" />
    <link rel="stylesheet" href="./components/base.css" />
    <link rel="stylesheet" href="./components/feedback.css" />
    <link rel="stylesheet" href="./fonts/fonts.css" />
  </head>

  <body style="background-color: var(--bg-color)">
    <div id="network-banner" class="network-banner" role="status" aria-live="polite"></div>
    <!-- 悬浮返回按钮 -->
    <button class="back-btn" id="back-btn" type="button" aria-label="返回上一页">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.4"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M15 5 8 12l7 7" />
      </svg>
    </button>

    <!-- 主内容：由 js/item.js 渲染（骨架屏 / 详情 / 错误态） -->
    <main class="detail" id="detail-root" aria-live="polite"></main>

    <script type="module" src="./js/item.js"></script>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
