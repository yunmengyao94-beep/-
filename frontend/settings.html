<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1890ff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="易校圈" />
    <link rel="apple-touch-icon" href="./assets/icons/logo-192.png" />
    <link rel="manifest" href="./manifest.json" />
    <meta name="description" content="易校圈 · 设置" />
    <title>设置 · 易校圈</title>

    <!-- 路由守卫：必须在业务脚本之前 -->
    <script src="./js/auth.js"></script>

    <link rel="stylesheet" href="./css/variables.css" />
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/layout.css" />
    <link rel="stylesheet" href="./components/base.css" />
    <link rel="stylesheet" href="./fonts/fonts.css" />
    <link rel="stylesheet" href="./components/feedback.css" />
  </head>

  <body class="page-with-tabbar" style="background-color: var(--bg-color)">
    <div id="network-banner" class="network-banner" role="status" aria-live="polite"></div>

    <header class="navbar">
      <button class="navbar__back" id="back-btn" type="button" aria-label="返回上一页">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.4"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M15 5 8 12l7 7" />
        </svg>
        <span>返回</span>
      </button>
      <span class="navbar__title navbar__title--center">设置</span>
      <span class="navbar__spacer" aria-hidden="true"></span>
    </header>

    <main class="page page--narrow" style="padding-bottom: 24px">
      <!-- ==================== 账号管理 ==================== -->
      <section class="setting-group" aria-labelledby="group-account">
        <h2 class="setting-group__title" id="group-account">账号管理</h2>

        <div class="setting-list">
          <div class="setting-row">
            <span>当前账号</span>
            <span class="setting-row__value" id="current-account">——</span>
          </div>

          <div
            class="setting-row setting-row--action"
            id="row-switch-account"
            role="button"
            tabindex="0"
          >
            <span>多账号切换</span>
            <span class="setting-row__value" id="account-count">0 个账号 →</span>
          </div>

          <div
            class="setting-row setting-row--action setting-row--danger"
            id="row-logout"
            role="button"
            tabindex="0"
          >
            <span>退出当前账号</span>
            <span class="setting-row__value">→</span>
          </div>
        </div>
      </section>

      <!-- ==================== 通用与隐私 ==================== -->
      <section class="setting-group" aria-labelledby="group-common">
        <h2 class="setting-group__title" id="group-common">通用与隐私</h2>

        <div class="setting-list">
          <div class="setting-row">
            <span>深色模式</span>
            <label class="switch" style="gap: 0">
              <input
                class="switch__input"
                id="theme-switch"
                type="checkbox"
                aria-label="深色模式"
              />
              <span class="switch__track" aria-hidden="true"></span>
            </label>
          </div>

          <div
            class="setting-row setting-row--action"
            id="row-clear-cache"
            role="button"
            tabindex="0"
          >
            <span>清除缓存</span>
            <span class="setting-row__value" id="cache-state">检查中…</span>
          </div>

          <div
            class="setting-row setting-row--action"
            id="row-replay-guide"
            role="button"
            tabindex="0"
          >
            <span>重新查看新手引导</span>
            <span class="setting-row__value">3 步 →</span>
          </div>

          <div
            class="setting-row setting-row--action"
            id="row-clear-orders"
            role="button"
            tabindex="0"
          >
            <span>清空本地订单记录</span>
            <span class="setting-row__value">仅本机</span>
          </div>
        </div>
      </section>

      <!-- ==================== 关于 ==================== -->
      <section class="setting-group" aria-labelledby="group-about">
        <h2 class="setting-group__title" id="group-about">关于</h2>

        <div class="setting-list">
          <div class="setting-row">
            <span>当前版本</span>
            <span class="setting-row__value">V1.0.0</span>
          </div>

          <a
            class="setting-row setting-row--action"
            id="row-agreement"
            href="./agreement.html"
            style="text-decoration: none"
          >
            <span>用户协议与隐私政策</span>
            <span class="setting-row__value">→</span>
          </a>
        </div>
      </section>

      <p class="auth-foot">易校圈 · 校园信用共享 V1.0.0</p>
    </main>

    <nav class="tabbar" aria-label="主导航">
      <a class="tabbar__item" href="./index.html">
        <span class="tabbar__icon" aria-hidden="true">🏠</span>
        <span>首页</span>
      </a>
      <a class="tabbar__item" href="./orders.html">
        <span class="tabbar__icon" aria-hidden="true">📋</span>
        <span>订单</span>
      </a>
      <a class="tabbar__item" href="./publish.html">
        <span class="tabbar__icon" aria-hidden="true">➕</span>
        <span>发布</span>
      </a>
      <a class="tabbar__item" href="./profile.html">
        <span class="tabbar__icon" aria-hidden="true">👤</span>
        <span>我的</span>
      </a>
    </nav>

    <script type="module" src="./js/settings.js"></script>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
