<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1890ff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="易校圈" />
    <link rel="apple-touch-icon" href="./assets/icons/logo-192.png" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <meta name="description" content="易校圈 · 我的订单" />
    <title>我的订单 · 易校圈</title>

    <!-- 路由守卫：必须在业务脚本之前 -->
    <script src="./js/auth.js"></script>

    <link rel="stylesheet" href="./css/variables.css" />
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/layout.css" />
    <link rel="stylesheet" href="./components/base.css" />
    <link rel="stylesheet" href="./fonts/fonts.css" />
    <link rel="stylesheet" href="./components/feedback.css" />
  </head>

  <body class="page-with-tabbar" style="background-color: var(--bg-color)">
    <div id="network-banner" class="network-banner" role="status" aria-live="polite"></div>

    <header class="navbar">
      <span class="navbar__title navbar__title--center">我的订单</span>
      <span class="navbar__spacer" aria-hidden="true"></span>
    </header>

    <main class="page page--narrow" style="padding-bottom: 24px">
      <!-- 方向切换 -->
      <div class="segmented" role="tablist" aria-label="订单方向">
        <button class="segmented__btn" id="tab-lend" type="button" role="tab" aria-selected="false">
          我借出的
        </button>
        <button
          class="segmented__btn is-active"
          id="tab-borrow"
          type="button"
          role="tab"
          aria-selected="true"
        >
          我借入的
        </button>
      </div>

      <!-- 状态筛选 -->
      <div class="chip-row" role="tablist" aria-label="订单状态">
        <button class="chip is-active" data-state="0" type="button" role="tab" aria-selected="true">
          待交接
        </button>
        <button class="chip" data-state="1" type="button" role="tab" aria-selected="false">
          使用中
        </button>
        <button class="chip" data-state="5" type="button" role="tab" aria-selected="false">
          待确认
        </button>
        <button class="chip" data-state="2" type="button" role="tab" aria-selected="false">
          已完成
        </button>
        <button class="chip" data-state="4" type="button" role="tab" aria-selected="false">
          已逾期
        </button>
      </div>

      <!-- 订单列表 -->
      <div id="order-list" aria-live="polite"></div>
      <div class="hidden" id="order-empty"></div>
      <p class="log-card__count" id="order-count" style="margin: 12px 16px 0">共 0 单</p>
    </main>

    <nav class="tabbar" aria-label="主导航">
      <a class="tabbar__item" href="./index.html">
        <span class="tabbar__icon" aria-hidden="true">🏠</span>
        <span>首页</span>
      </a>
      <a class="tabbar__item is-active" href="./orders.html" aria-current="page">
        <span class="tabbar__icon" aria-hidden="true">📋</span>
        <span>订单</span>
      </a>
      <a class="tabbar__item" href="./publish.html">
        <span class="tabbar__icon" aria-hidden="true">➕</span>
        <span>发布</span>
      </a>
      <a class="tabbar__item" href="./profile.html">
        <span class="tabbar__icon" aria-hidden="true">👤</span>
        <span>我的</span>
      </a>
    </nav>

    <script type="module" src="./js/orders.js"></script>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
